<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bora Começar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #ffffff;
    --paper: #fbfaff;
    --ink: #16132a;
    --ink-soft: #6b6685;
    --cyan: #06a9c7;
    --pink: #ec4899;
    --purple: #7c3aed;
    --purple-deep: #4c1d78;
    --line: #ece9f7;
    --shadow: rgba(76, 29, 120, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .stage {
    position: relative;
    width: min(1100px, 94vw);
    min-height: min(680px, 92vh);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: clamp(16px, 4vw, 56px);
    padding: clamp(28px, 5vw, 64px) clamp(20px, 5vw, 56px) 0;
  }

  /* ---- decorative geometry (quiet, off to the sides) ---- */
  .deco {
    position: absolute;
    pointer-events: none;
    opacity: 0.55;
  }
  .deco-tri {
    top: 19%;
    left: 5%;
    width: 46px;
    height: 46px;
    border: 2.5px solid var(--cyan);
    border-radius: 8px;
    transform: rotate(18deg);
    opacity: 0.35;
    animation: floatSlow 7s ease-in-out infinite;
  }
  .deco-circle {
    bottom: 14%;
    left: 4.5%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--pink);
    opacity: 0.28;
    animation: floatSlow 8s ease-in-out infinite reverse;
  }
  .deco-ring {
    top: 16%;
    right: 8%;
    width: 64px;
    height: 64px;
    border: 2.5px solid var(--purple);
    border-radius: 50%;
    opacity: 0.22;
    animation: floatSlow 9s ease-in-out infinite;
  }
  .deco-plus {
    bottom: 22%;
    right: 5.5%;
    width: 26px;
    height: 26px;
    opacity: 0.3;
    animation: floatSlow 6.5s ease-in-out infinite reverse;
  }
  .deco-plus::before, .deco-plus::after {
    content: '';
    position: absolute;
    background: var(--cyan);
  }
  .deco-plus::before { width: 100%; height: 3px; top: 50%; left: 0; transform: translateY(-50%); border-radius: 2px; }
  .deco-plus::after { width: 3px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); border-radius: 2px; }

  @keyframes floatSlow {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-14px) rotate(var(--r, 0deg)); }
  }
  .deco-tri { --r: 18deg; }

  /* ---- brand (Mateka logo) ---- */
  .kicker-wrap {
    position: absolute;
    top: clamp(24px, 5vw, 48px);
    left: clamp(20px, 5vw, 56px);
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.15s forwards;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 50%, var(--pink) 100%);
    box-shadow: 0 6px 14px -6px var(--shadow);
  }
  .brand-icon span {
    color: #ffffff;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    line-height: 1;
  }
  .brand-word {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.18rem;
    letter-spacing: -0.02em;
  }
  .brand-mat { color: var(--ink); opacity: 0.32; }
  .brand-eka { color: var(--cyan); }

  .kicker-sep {
    width: 1px;
    height: 18px;
    background: var(--line);
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--purple-deep);
  }

  /* ---- message column ---- */
  .message-col {
    flex: 1 1 420px;
    max-width: 560px;
    padding-bottom: clamp(48px, 10vh, 96px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .bubble {
    position: relative;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: clamp(24px, 3.4vw, 34px) clamp(26px, 3.6vw, 38px);
    box-shadow: 0 22px 48px -18px var(--shadow), 0 2px 6px rgba(22, 19, 42, 0.04);
    opacity: 0;
    transform: translateY(18px) scale(0.97);
    animation: popIn 0.62s cubic-bezier(0.2, 0.9, 0.25, 1.15) 0.42s forwards;
  }

  .bubble::after {
    content: '';
    position: absolute;
    left: 52px;
    bottom: -17px;
    width: 34px;
    height: 34px;
    background: var(--paper);
    border-right: 1.5px solid var(--line);
    border-bottom: 1.5px solid var(--line);
    border-radius: 0 0 6px 0;
    transform: rotate(45deg);
  }

  .bubble-lede {
    margin: 0 0 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.9rem, 3.6vw, 2.65rem);
    line-height: 1.06;
    letter-spacing: -0.01em;
    text-wrap: balance;
    background: linear-gradient(100deg, var(--purple-deep) 0%, var(--purple) 55%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .bubble-body {
    margin: 0;
    font-size: clamp(1.05rem, 1.6vw, 1.25rem);
    font-weight: 500;
    line-height: 1.42;
    color: var(--ink);
    max-width: 46ch;
  }

  .hint-row {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease 1.05s forwards;
    padding-left: 4px;
  }

  .hint-chevron {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--ground);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 1.8s ease-in-out infinite;
  }
  .hint-chevron svg { width: 12px; height: 12px; display: block; }

  .hint-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  /* ---- mascot ---- */
  .mascot-col {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .mascot-figure {
    width: clamp(220px, 30vw, 380px);
    height: auto;
    display: block;
    filter: drop-shadow(0 26px 40px var(--shadow));
    opacity: 0;
    transform: translateY(60px) scale(0.9);
    animation:
      dropIn 0.75s cubic-bezier(0.18, 0.86, 0.3, 1.1) 0.05s forwards,
      idleBob 4.2s ease-in-out 0.9s infinite;
  }

  @keyframes dropIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes idleBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-9px) scale(1); }
  }

  @keyframes popIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .stage {
      flex-direction: column-reverse;
      align-items: center;
      justify-content: flex-end;
      padding-top: 100px;
      gap: 8px;
    }
    .message-col { padding-bottom: 8px; text-align: center; align-items: center; }
    .bubble { text-align: left; }
    .mascot-figure { width: clamp(180px, 52vw, 260px); }
    .hint-row { align-self: center; }
    .deco { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .mascot-figure, .kicker-wrap, .hint-row {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .deco-tri, .deco-circle, .deco-ring, .deco-plus, .hint-chevron {
      animation: none !important;
    }
  }
</style>
</head>
